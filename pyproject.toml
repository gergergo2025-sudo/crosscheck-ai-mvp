[project]
name = "crosscheck-ai"
version = "0.1.0"
description = "CrossCheck AI — multi-model answer verification and consensus platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "redis>=5.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
# NOTE: 后续由 Anneal 按需求追加依赖，例如:
#   openai, anthropic, deepseek(或统一用 litellm)、tavily-python 等

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crosscheck"]

[tool.uv]
# 统一用 src 布局，构建与运行都从 src 导入
package = true
